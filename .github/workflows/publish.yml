name: Publish @wadeck-app/shared-cli

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version (e.g. 1.2.0)'
        required: false
        default: ''
      breaking:
        description: 'Breaking change? (true/false)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - run: npm ci

      - name: Compute version
        id: version
        run: bash ci/scripts/compute-version.sh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          BREAKING_INPUT: ${{ github.event.inputs.breaking }}

      - name: Inject version
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - run: npm run build

      - run: npm test

      - name: Configure auth for GitHub Packages
        run: |
          echo "@wadeck-app:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @wadeck-app/shared-cli
        run: npm publish --tag ${{ steps.version.outputs.dist_tag }}
