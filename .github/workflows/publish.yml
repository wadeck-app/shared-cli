name: Publish @wadeck/shared-cli

env:
  GITLAB_NPM_REGISTRY_PATH: //gitlab.com/api/v4/projects/84445653/packages/npm/

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version (e.g. 1.2.0)'
        required: false
        default: ''
      breaking:
        description: 'Breaking change? (true/false)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate tokens
        run: |
          # --- READ token ---
          READ=$(echo "${GITLAB_NPM_READ_TOKEN}" | tr -d '[:space:]')
          [ -z "$READ" ] && echo "::error::GITLAB_NPM_READ_TOKEN is empty" && exit 1
          echo "READ token: ${READ:0:9}*** (length: ${#READ})"
          # Use -/whoami endpoint: does not depend on any package existing (safe for first publish).
          HTTP_READ=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${READ}" \
            "https:${GITLAB_NPM_REGISTRY_PATH}-/whoami")
          case "$HTTP_READ" in
            200) echo "READ token: read_package_registry OK (HTTP 200)" ;;
            401) echo "::error::GITLAB_NPM_READ_TOKEN invalid or expired (HTTP 401)" ; exit 1 ;;
            403) echo "::error::GITLAB_NPM_READ_TOKEN lacks read_package_registry scope (HTTP 403)" ; exit 1 ;;
            *)   echo "::error::GITLAB_NPM_READ_TOKEN unexpected HTTP ${HTTP_READ}" ; exit 1 ;;
          esac

          # --- WRITE token ---
          WRITE=$(echo "${GITLAB_NPM_WRITE_TOKEN}" | tr -d '[:space:]')
          [ -z "$WRITE" ] && echo "::error::GITLAB_NPM_WRITE_TOKEN is empty" && exit 1
          echo "WRITE token: ${WRITE:0:9}*** (length: ${#WRITE})"
          # Try introspection (PAT then deploy token)
          INTROSPECT=$(curl -s -H "Authorization: Bearer ${WRITE}" "https://gitlab.com/api/v4/personal_access_tokens/self")
          if ! echo "$INTROSPECT" | grep -q '"scopes"'; then
            INTROSPECT=$(curl -s -H "Authorization: Bearer ${WRITE}" "https://gitlab.com/api/v4/deploy_tokens/self")
          fi
          if echo "$INTROSPECT" | grep -q '"scopes"'; then
            if ! echo "$INTROSPECT" | grep -q 'write_package_registry'; then
              echo "::error::GITLAB_NPM_WRITE_TOKEN lacks write_package_registry scope. Got: ${INTROSPECT}" ; exit 1
            fi
            echo "WRITE token: write_package_registry OK (via introspection)"
          else
            # PyPI POST probe: GitLab validates scope BEFORE content.
            # 400 = has write_package_registry (content missing error, nothing written)
            # 403 = lacks write_package_registry
            PROJECT_ID=$(echo "${GITLAB_NPM_REGISTRY_PATH}" | grep -o '[0-9]\+')
            HTTP_WRITE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -X POST \
              -H "Authorization: Bearer ${WRITE}" \
              "https://gitlab.com/api/v4/projects/${PROJECT_ID}/packages/pypi")
            case "$HTTP_WRITE" in
              400) echo "WRITE token: write_package_registry OK (PyPI probe HTTP 400 -- nothing created)" ;;
              403) echo "::error::GITLAB_NPM_WRITE_TOKEN lacks write_package_registry scope (HTTP 403)" ; exit 1 ;;
              404) echo "::error::GITLAB_NPM_WRITE_TOKEN has no visibility to this project (HTTP 404)" ; exit 1 ;;
              401) echo "::error::GITLAB_NPM_WRITE_TOKEN invalid or expired (HTTP 401)" ; exit 1 ;;
              *)   echo "::error::GITLAB_NPM_WRITE_TOKEN unexpected HTTP ${HTTP_WRITE}" ; exit 1 ;;
            esac
          fi
        env:
          GITLAB_NPM_READ_TOKEN: ${{ secrets.GITLAB_NPM_READ_TOKEN }}
          GITLAB_NPM_WRITE_TOKEN: ${{ secrets.GITLAB_NPM_WRITE_TOKEN }}

      - name: Configure GitLab npm registry (read -- for npm install)
        run: |
          TOKEN=$(echo "${GITLAB_NPM_READ_TOKEN}" | tr -d '[:space:]')
          echo "@wadeck:registry=https:${GITLAB_NPM_REGISTRY_PATH}" >> ~/.npmrc
          echo "${GITLAB_NPM_REGISTRY_PATH}:_authToken=${TOKEN}" >> ~/.npmrc
          echo "auth-type=legacy" >> ~/.npmrc
          echo "=== whoami ===" && curl -s "https:${GITLAB_NPM_REGISTRY_PATH}-/whoami" -H "Authorization: Bearer ${TOKEN}"
          echo ""
        env:
          GITLAB_NPM_READ_TOKEN: ${{ secrets.GITLAB_NPM_READ_TOKEN }}

      - run: npm install --prefer-offline

      - name: Compute version
        id: version
        run: bash ci/scripts/compute-version.sh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          BREAKING_INPUT: ${{ github.event.inputs.breaking }}

      - name: Inject version
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - run: npm run build

      - run: npm test

      - name: Configure GitLab npm registry (write -- for npm publish)
        run: |
          TOKEN=$(echo "${GITLAB_NPM_WRITE_TOKEN}" | tr -d '[:space:]')
          [ -z "$TOKEN" ] && echo "::error::GITLAB_NPM_WRITE_TOKEN is empty" && exit 1
          echo "WRITE token: ${TOKEN:0:9}*** (length: ${#TOKEN})"
          echo "@wadeck:registry=https:${GITLAB_NPM_REGISTRY_PATH}" >> ~/.npmrc
          echo "${GITLAB_NPM_REGISTRY_PATH}:_authToken=${TOKEN}" >> ~/.npmrc
          echo "auth-type=legacy" >> ~/.npmrc
          echo "=== .npmrc (token masked) ===" && sed 's/_authToken=.*/_authToken=***/' ~/.npmrc
          echo "=== whoami ===" && curl -s "https:${GITLAB_NPM_REGISTRY_PATH}-/whoami" -H "Authorization: Bearer ${TOKEN}"
          echo ""
        env:
          GITLAB_NPM_WRITE_TOKEN: ${{ secrets.GITLAB_NPM_WRITE_TOKEN }}

      - name: Publish @wadeck/shared-cli
        run: npm publish --tag ${{ steps.version.outputs.dist_tag }}
